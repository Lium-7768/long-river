<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>长河 · 中国通史</title>
<style>
/* ============================================================
   长河 · 重构版
   形态：横向时间轨 + 等距分层内容扇
   技术：DOM + CSS 3D（不用 WebGL）— 文字锐利、网格精确、层次可控
   ============================================================ */
:root{
  --bg:#070a0c; --ink:#e8eef0; --ink-2:#8fa0a8; --ink-3:#4e5c64;
  --jade:#5fd6bd; --amber:#d9a15f; --gold:#e8c98a; --red:#e08a7a; --blue:#93a8e8;
  --serif:"Songti SC","Source Han Serif SC","Noto Serif SC",serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:var(--sans);-webkit-font-smoothing:antialiased;user-select:none}

body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 90% 50% at 50% -10%,rgba(95,214,189,.10),transparent 70%),
    radial-gradient(ellipse 70% 40% at 50% 110%,rgba(147,168,232,.05),transparent 70%),
    linear-gradient(180deg,#070a0c,#090d10 50%,#070a0c)}
body::after{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.45;
  background-image:
    linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.022) 1px,transparent 1px);
  background-size:64px 64px}

header{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;
  align-items:center;justify-content:space-between;padding:26px 40px;pointer-events:none}
.brand{display:flex;align-items:baseline;gap:14px;pointer-events:auto}
.brand h1{font-family:var(--serif);font-size:19px;font-weight:400;
  letter-spacing:.5em;color:#cfe6e0}
.brand em{font-style:normal;font-size:9.5px;letter-spacing:.4em;color:var(--ink-3)}
.bc{display:flex;align-items:center;gap:13px;font-size:12.5px;letter-spacing:.14em;
  color:var(--ink-3);pointer-events:auto;font-family:var(--serif)}
.bc b{font-weight:400;cursor:pointer;transition:color .3s}
.bc b:hover{color:var(--jade)}
.bc b.on{color:var(--ink)}
.bc s{text-decoration:none;color:#2a363c}

/* 顶部模式切换 */
.modes{display:flex;gap:22px;pointer-events:auto;font-family:var(--serif);
  font-size:12px;letter-spacing:.24em}
.modes b{font-weight:400;color:var(--ink-3);cursor:pointer;
  padding-bottom:5px;border-bottom:1px solid transparent;transition:.3s}
.modes b:hover{color:var(--ink-2)}
.modes b.on{color:var(--jade);border-bottom-color:var(--jade)}

/* 目录模式（家族/地点/年号）：整屏 2D 面板 */
#catalog{position:fixed;inset:0;z-index:40;background:
    linear-gradient(180deg,rgba(7,10,12,.97),rgba(8,11,13,.99));
  padding:110px 6% 60px;overflow-y:auto;
  opacity:0;pointer-events:none;transition:opacity .5s}
#catalog.on{opacity:1;pointer-events:auto}
.cat-sec{margin-bottom:56px}
.cat-sec h3{font-family:var(--serif);font-size:13px;font-weight:400;
  letter-spacing:.36em;color:var(--jade);margin-bottom:6px;
  display:flex;align-items:baseline;gap:12px}
.cat-sec h3 em{font-style:normal;font-size:10px;letter-spacing:.1em;
  color:var(--ink-3);font-family:var(--sans)}
.cat-sec .sub{font-size:12px;color:var(--ink-3);letter-spacing:.06em;
  margin-bottom:22px;font-family:var(--serif);line-height:1.9}
.cat-grid{display:grid;gap:14px;
  grid-template-columns:repeat(auto-fill,minmax(232px,1fr))}
.ctile{padding:16px 18px;border:1px solid rgba(95,214,189,.14);border-radius:4px;
  background:linear-gradient(150deg,rgba(18,25,28,.7),rgba(11,15,17,.8));
  cursor:pointer;transition:.35s;position:relative}
.ctile:hover{border-color:rgba(95,214,189,.5);
  box-shadow:0 14px 36px -12px rgba(0,0,0,.9),0 0 26px -8px rgba(95,214,189,.4)}
.ctile .tn{font-family:var(--serif);font-size:16px;letter-spacing:.1em;
  color:var(--ink);margin-bottom:7px}
.ctile .tm{font-size:10px;letter-spacing:.1em;color:var(--ink-3);
  margin-bottom:9px;font-family:var(--serif)}
.ctile .td{font-size:12px;line-height:1.85;color:#93a8a3;letter-spacing:.03em;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ctile .cnt{position:absolute;top:14px;right:16px;font-size:10px;
  letter-spacing:.05em;color:var(--amber);opacity:.75}
/* 年号密排 */
.era-wrap{display:flex;flex-wrap:wrap;gap:8px}
.era-chip{font-family:var(--serif);font-size:13px;letter-spacing:.14em;
  padding:8px 15px;border:1px solid rgba(95,214,189,.18);border-radius:3px;
  background:rgba(95,214,189,.03);cursor:pointer;transition:.3s;color:#a6c2bc}
.era-chip:hover{border-color:rgba(95,214,189,.65);color:#e6f6f1;
  background:rgba(95,214,189,.11)}
.era-chip em{font-style:normal;font-size:9px;color:var(--ink-3);
  margin-left:7px;letter-spacing:.02em}
.era-group{margin-bottom:26px}
.era-group .gl{font-size:10.5px;letter-spacing:.3em;color:var(--ink-3);
  margin-bottom:13px;font-family:var(--serif)}

.legend{position:fixed;left:40px;bottom:28px;z-index:30;font-size:10.5px;
  letter-spacing:.16em;color:var(--ink-3);line-height:2.4;font-family:var(--serif)}
.legend i{display:inline-block;width:16px;height:2px;margin-right:10px;
  vertical-align:middle;border-radius:2px}
.hint{position:fixed;right:40px;bottom:30px;z-index:30;font-size:10.5px;
  letter-spacing:.2em;color:var(--ink-3);text-align:right;line-height:2.2;
  font-family:var(--serif)}
.hint em{font-style:normal;color:var(--jade)}

#stage{position:fixed;inset:0;z-index:10;perspective:2400px;
  perspective-origin:50% 46%}
#world{position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform 1.1s cubic-bezier(.22,.9,.24,1)}

.track{position:absolute;left:6%;right:6%;top:50%;height:1px;
  transform:translateZ(-40px);
  background:linear-gradient(90deg,transparent,rgba(95,214,189,.18) 8%,
    rgba(95,214,189,.5) 50%,rgba(95,214,189,.18) 92%,transparent)}
.track::after{content:'';position:absolute;inset:-8px 0;filter:blur(9px);
  background:linear-gradient(90deg,transparent,rgba(95,214,189,.28),transparent)}

#axis{position:absolute;left:6%;right:6%;top:50%;height:0;
  transform-style:preserve-3d}

.tick{position:absolute;top:0;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;cursor:pointer;
  transition:opacity .5s cubic-bezier(.4,0,.2,1);will-change:transform,opacity}
.tick .pin{width:7px;height:7px;border-radius:50%;background:var(--jade);
  box-shadow:0 0 12px rgba(95,214,189,.9),0 0 26px rgba(95,214,189,.45);
  transition:all .45s cubic-bezier(.34,1.4,.5,1)}
.tick.chaos .pin{background:var(--amber);
  box-shadow:0 0 12px rgba(217,161,95,.9),0 0 26px rgba(217,161,95,.45)}
.tick .nm{position:absolute;font-family:var(--serif);font-size:15px;
  letter-spacing:.24em;color:var(--ink-2);white-space:nowrap;
  transition:all .45s cubic-bezier(.34,1.4,.5,1)}
.tick.up .nm{bottom:22px}
.tick.down .nm{top:22px}
.tick .yr{position:absolute;font-size:9.5px;letter-spacing:.1em;
  color:var(--ink-3);white-space:nowrap;transition:all .45s}
.tick.up .yr{bottom:6px}
.tick.down .yr{top:6px}
.tick:hover .nm{color:var(--ink);letter-spacing:.34em}
.tick:hover .pin{transform:scale(1.5)}
.tick.active .nm{color:var(--ink);font-size:17px;letter-spacing:.34em}
.tick.active .pin{transform:scale(1.7)}
#axis.focused .tick:not(.active){opacity:.2;filter:blur(.6px)}
#axis.focused .tick:not(.active):hover{opacity:.6;filter:none}

#fan{position:absolute;left:0;top:50%;width:100%;height:0;
  transform-style:preserve-3d;pointer-events:none}
.pillar{position:absolute;width:1px;top:0;
  background:linear-gradient(180deg,rgba(95,214,189,.55),rgba(95,214,189,0));
  opacity:0;transition:opacity .6s .1s}
#fan.on .pillar{opacity:1}

.card{position:absolute;width:172px;padding:13px 15px 14px;
  background:linear-gradient(150deg,rgba(18,25,28,.94),rgba(11,15,17,.96));
  border:1px solid rgba(95,214,189,.16);border-radius:3px;cursor:pointer;
  pointer-events:auto;
  /* 入场：淡入 + 微微上浮 */
  opacity:0;transform:translateY(8px) scale(.985);
  transition:opacity .6s cubic-bezier(.22,.9,.24,1),
             transform .6s cubic-bezier(.22,.9,.24,1),
             border-color .35s,box-shadow .35s;
  will-change:opacity,transform;backdrop-filter:blur(6px)}
.card.in{opacity:1;transform:translateY(0) scale(1)}
.card::before{content:'';position:absolute;left:0;top:11px;bottom:11px;width:2px;
  border-radius:2px;background:var(--c,var(--gold));opacity:.85}
.card .ct{font-size:8.5px;letter-spacing:.3em;color:var(--c,var(--gold));
  opacity:.8;margin-bottom:7px}
.card .cn{font-family:var(--serif);font-size:15px;letter-spacing:.08em;
  color:var(--ink);line-height:1.4}
.card .cy{font-size:9.5px;letter-spacing:.06em;color:var(--ink-3);margin-top:6px}
.card:hover{border-color:var(--c,var(--gold));
  box-shadow:0 0 0 1px rgba(255,255,255,.04),
             0 14px 40px -10px rgba(0,0,0,.85),
             0 0 34px -6px var(--c,var(--gold))}
.card.dim{opacity:.28!important;filter:grayscale(.4)}
.card.dim:hover{opacity:.85!important;filter:none}

.thread{position:absolute;height:1px;transform-origin:left center;
  background:linear-gradient(90deg,var(--c,var(--gold)),transparent);
  opacity:0;transition:opacity .7s}
#fan.on .thread{opacity:.4}

/* 组标题：贴在左缘的小标签，带短横线 + 计数 */
.ghead{position:absolute;display:flex;align-items:center;gap:9px;
  font-family:var(--serif);font-size:11px;letter-spacing:.3em;
  color:var(--c,var(--gold));white-space:nowrap;
  opacity:0;transition:opacity .5s}
#fan.on .ghead{opacity:.9}
.ghead i{display:block;width:14px;height:1px;background:var(--c,var(--gold));opacity:.7}
.ghead em{font-style:normal;font-size:9px;letter-spacing:.05em;opacity:.55;
  font-family:var(--sans)}

#drawer{position:fixed;top:0;right:0;height:100%;width:392px;max-width:92vw;
  z-index:60;background:linear-gradient(180deg,rgba(10,14,16,.98),rgba(7,10,12,.99));
  border-left:1px solid rgba(95,214,189,.2);padding:76px 38px 50px;
  overflow-y:auto;transform:translateX(101%);
  transition:transform .68s cubic-bezier(.16,.9,.24,1);
  box-shadow:-50px 0 110px rgba(0,0,0,.9);backdrop-filter:blur(18px)}
#drawer.on{transform:translateX(0)}
#drawer .x{position:absolute;top:30px;right:30px;width:34px;height:34px;
  cursor:pointer;color:var(--ink-3);font-size:17px;line-height:34px;
  text-align:center;border-radius:50%;transition:.3s;border:1px solid transparent}
#drawer .x:hover{color:var(--jade);border-color:rgba(95,214,189,.35);
  background:rgba(95,214,189,.06)}
#drawer .tag{font-size:9px;letter-spacing:.44em;color:var(--jade);margin-bottom:16px}
#drawer h2{font-family:var(--serif);font-size:28px;font-weight:400;
  letter-spacing:.12em;line-height:1.45;margin-bottom:9px;color:#f4faf8}
#drawer .life{font-size:11.5px;letter-spacing:.13em;color:var(--ink-2);
  font-family:var(--serif)}
#drawer .div{height:1px;margin:26px 0;
  background:linear-gradient(90deg,rgba(95,214,189,.45),transparent 90%)}
#drawer .bd{font-size:13.5px;line-height:2.15;color:#b6c8c3;letter-spacing:.04em}
#drawer .bd p{margin-bottom:16px}
#drawer .meta{font-size:11.5px;letter-spacing:.08em;color:#8fb0a9;
  margin-bottom:18px;line-height:1.9;font-family:var(--serif)}
#drawer .kl{display:block;font-size:9px;letter-spacing:.4em;color:var(--jade);
  margin-bottom:14px}
#drawer .chips{display:flex;flex-wrap:wrap;gap:9px}
#drawer .chip{font-size:12px;padding:7px 15px;border-radius:16px;
  border:1px solid rgba(95,214,189,.24);color:#a6c2bc;cursor:pointer;
  transition:.3s;letter-spacing:.07em;font-family:var(--serif);
  background:rgba(95,214,189,.03)}
#drawer .chip:hover{border-color:rgba(95,214,189,.7);color:#e6f6f1;
  background:rgba(95,214,189,.11);box-shadow:0 0 22px -4px rgba(95,214,189,.45)}
#drawer::-webkit-scrollbar{width:3px}
#drawer::-webkit-scrollbar-thumb{background:rgba(95,214,189,.3)}

#scrim{position:fixed;inset:0;z-index:50;background:rgba(4,7,9,.35);
  opacity:0;pointer-events:none;transition:opacity .6s}
#scrim.on{opacity:1}

@media(max-width:820px){
  header{padding:18px 20px}
  .brand h1{font-size:16px;letter-spacing:.3em}
  .bc{font-size:11px;gap:8px}
  .legend{left:20px;bottom:16px;font-size:9px}
  .hint{display:none}
  .card{width:150px}
}
</style>
</head>
<body>

<header>
  <div class="brand"><h1>长河</h1><em>RIVER OF DYNASTIES</em></div>
  <nav class="bc" id="bc"></nav>
  <div class="modes" id="modes">
    <b class="on" data-m="river">时间轴</b>
    <b data-m="clan">家族</b>
    <b data-m="place">地点</b>
    <b data-m="era">年号</b>
  </div>
</header>

<div class="legend">
  <div><i style="background:linear-gradient(90deg,#5fd6bd,transparent)"></i>朝代</div>
  <div><i style="background:linear-gradient(90deg,#d9a15f,transparent)"></i>乱世并立</div>
  <div><i style="background:linear-gradient(90deg,#e8c98a,transparent)"></i>人物 · 事件 · 作品</div>
</div>
<div class="hint"><div>点击朝代展开内容</div><div>点击卡片查看详情</div></div>

<div id="stage">
  <div id="world">
    <div class="track"></div>
    <div id="axis"></div>
    <div id="fan"></div>
  </div>
</div>

<!-- 目录模式：家族 / 地点 / 年号 -->
<div id="catalog">
  <div class="cat-inner" id="cat-inner"></div>
</div>

<div id="scrim"></div>
<div id="drawer">
  <div class="x" onclick="closeDrawer()">✕</div>
  <div class="tag" id="d-tag"></div>
  <h2 id="d-name"></h2>
  <div class="life" id="d-life"></div>
  <div class="div"></div>
  <div class="bd" id="d-body"></div>
</div>

<script src="data.js"></script>
<script>
/* ============================================================
   长河 · 重构
   一级：时间轴上规整的朝代刻度
   二级：点击刻度 → 等距网格内容扇展开
   三级：点击卡片 → 抽屉
   ============================================================ */
const ROOT = (window.LONG_RIVER_DATA||{}).root;

const COLOR = {
  dynasty:'#5fd6bd', chaos:'#d9a15f', regime:'#d9b47a',
  person:'#e8c98a', event:'#e08a7a', work:'#93a8e8',
  school:'#a8d8b0', reform:'#d98fb0', treaty:'#8fd0d8', office:'#b8b0d8'
};
const TYPECN = {dynasty:'朝代',chaos:'乱世',regime:'政权',
  person:'人物',event:'事件',work:'作品',
  school:'学派',reform:'新法',treaty:'盟约',office:'制度'};
const BODY = {
  person:'姓名字号 · 生卒 · 郡望与家族 · 入仕途径 · 仕途迁转 · 代表作品 · 参与事件 · 人际关系。',
  event:'年份 · 地点 · 参与人物 · 起因经过影响 · 相关作品 · 因果边。',
  work:'类型 · 作者 · 创作年份 · 原文或摘录 · 创作背景 · 关联人物与事件。',
  regime:'起止年 · 都城 · 帝王纪年轴 · 重大事件 · 代表人物。',
  dynasty:'起止年 · 都城 · 分期 · 帝王 · 重大事件 · 代表人物 · 同期并立政权。',
  chaos:'并立政权 · 存续跨度 · 更替关系 · 同期中原王朝。',
  school:'宗旨 · 师承边 · 代表人物 · 代表著作 · 与其他学派的分野。',
  reform:'政策包 · 推行者 · 反对者 · 起止 · 成效与争议。',
  treaty:'缔约方 · 岁币 · 边界划定 · 存续期 · 后续影响。',
  office:'名称 · 品阶 · 所属机构 · 职掌 · 历任者 · 前后朝沿革。'
};
const fmtY = y => (y==null||y==='') ? '?' : (y<0 ? `前${-y}` : `${y}`);

const all = [];
(function walk(n,d){ n._d=d; all.push(n); (n.children||[]).forEach(c=>walk(c,d+1)); })(ROOT,-1);

const axis = document.getElementById('axis');
const fam  = document.getElementById('fan');
const TIERS = ROOT.children;
const NW = TIERS.length;
let active = null, leaf = null;

/* ---------- 一级刻度 ---------- */
TIERS.forEach((tier,i)=>{
  const pct = NW>1 ? (i/(NW-1))*100 : 50;
  const isChaos = tier.type==='chaos';
  const up = i%2===0;
  const el = document.createElement('div');
  el.className = `tick ${isChaos?'chaos':''} ${up?'up':'down'}`;
  el.style.left = pct+'%';
  el.innerHTML = `<div class="pin"></div>
    <div class="nm">${tier.name}</div>
    <div class="yr">${fmtY(tier.from)}–${fmtY(tier.to)}</div>`;
  el.addEventListener('click', e=>{ e.stopPropagation(); enterTier(tier); });
  axis.appendChild(el);
  tier._el=el; tier._pct=pct; tier._up=up;
});

/* ---------- 二级内容扇 ---------- */
function anchorPx(tier){
  const w = window.innerWidth;
  const L = 0.06*w, R = 0.94*w;
  return L + (tier._pct/100)*(R-L);
}

// 分组顺序 + 组名：把一堆条目按类型切成有标题的段
const GROUP_ORDER = ['regime','person','event','work','school','reform','treaty','office'];
const GROUP_NAME  = {
  regime:'政权', person:'人物', event:'事件', work:'作品',
  school:'学派', reform:'新法', treaty:'盟约', office:'制度'
};

function buildFan(tier){
  fam.innerHTML=''; fam.classList.remove('on');
  const kids = (tier.children||[]);
  const ax = anchorPx(tier);

  const CARD_W = 172, GAP = 18, ROW_H = 138, HEAD_H = 46;

  // ---- 列数自适应：用整个视口宽度排布，避免因纵向过高而缩放 ----
  // 可用宽度 = 视口宽 - 左边距(锚点在0.32W) - 右留白
  const availW = Math.max(window.innerWidth*0.62, 640) - 40;
  const PER = Math.max(3, Math.floor((availW + GAP) / (CARD_W + GAP)));

  // 按类型分组
  const groups = [];
  GROUP_ORDER.forEach(t=>{
    const items = kids.filter(k=>k.type===t);
    if(items.length) groups.push({type:t, name:GROUP_NAME[t]||'其他', items});
  });
  // 未在 ORDER 里的类型兜底
  const other = kids.filter(k=>!GROUP_ORDER.includes(k.type));
  if(other.length) groups.push({type:'other', name:'其他', items:other});

  if(!groups.length){
    fam.classList.add('on');
    return;
  }

  // 预估总高（用于光柱与自适应缩放）
  let totalRows = 0;
  groups.forEach(g=> totalRows += 1 + Math.ceil(g.items.length/PER));
  const totalH = totalRows*ROW_H + groups.length*HEAD_H + 40;

  // ---- 纵向适配：仅当仍放不下时才轻微缩放（下限 0.62，保证可读）----
  const avail = window.innerHeight - 170;
  const fit = Math.min(1, Math.max(0.62, avail / Math.max(totalH, 1)));
  fam.style.transformOrigin = `0 0`;
  fam.style.transform = fit < 1 ? `scale(${fit.toFixed(3)})` : '';
  if(fit < 0.999) {
    // 缩放后仍超出 → 允许纵向拖动（提示）
    fam.dataset.scaled = '1';
  } else {
    delete fam.dataset.scaled;
  }

  const pil = document.createElement('div');
  pil.className='pillar'; pil.style.left = ax+'px';
  pil.style.height = totalH+'px';
  fam.appendChild(pil);

  let cursorY = 42;        // 当前行的纵向位置
  let cardIdx = 0;

  groups.forEach(g=>{
    const col = COLOR[g.type] || COLOR.gold;

    // 组标题：贴着左缘，带一条短横线
    const head = document.createElement('div');
    head.className = 'ghead';
    head.style.setProperty('--c', col);
    head.style.left = (ax - 4) + 'px';
    head.style.top  = cursorY + 'px';
    head.innerHTML = `<i></i>${g.name}<em>${g.items.length}</em>`;
    fam.appendChild(head);
    cursorY += HEAD_H;

    // 组内卡片
    g.items.forEach((k,i)=>{
      const row = Math.floor(i/PER);
      const inRow = i%PER;
      const cnt = Math.min(PER, g.items.length - row*PER);
      const c = COLOR[k.type]||COLOR.gold;
      const y = cursorY + row*ROW_H;

      const card = document.createElement('div');
      card.className='card';
      card.style.setProperty('--c',c);
      card.innerHTML = `<div class="ct">${TYPECN[k.type]||'条目'}</div>
        <div class="cn">${k.name}</div>
        <div class="cy">${(k.from==null&&k.to==null)?'':fmtY(k.from)+'–'+fmtY(k.to)}</div>`;
      card.addEventListener('click', e=>{ e.stopPropagation(); openDrawer(k); });

      const offInRow = (inRow - (cnt-1)/2)*(CARD_W+GAP);
      const rowBias  = row*26;
      const x = ax + offInRow + rowBias - CARD_W/2;

      card.style.left = x+'px';
      card.style.top  = y+'px';

      const th=document.createElement('div');
      th.className='thread';
      th.style.setProperty('--c',c);
      const tx = Math.min(ax, x+CARD_W/2);
      th.style.left = tx+'px';
      th.style.top  = (y+20)+'px';
      th.style.width = Math.abs((x+CARD_W/2)-ax)+'px';
      fam.appendChild(th);
      fam.appendChild(card);

      setTimeout(()=>card.classList.add('in'), 10 + cardIdx*22);
      cardIdx++;
    });

    cursorY += Math.ceil(g.items.length/PER)*ROW_H + 14;
  });

  fam.classList.add('on');
}

/* ---------- 进入 / 复位 ---------- */
function enterTier(tier){
  active = tier; leaf=null;
  document.querySelectorAll('.tick').forEach(e=>e.classList.remove('active'));
  tier._el.classList.add('active');
  axis.classList.add('focused');

  // 世界平移：让激活刻度靠近画面左 1/3，并整体上移给扇留空间
  const w = window.innerWidth;
  const ax = anchorPx(tier);
  const wantX = w*0.32;
  const dx = wantX - ax;
  const dy = tier._up ? -46 : 46;
  document.getElementById('world').style.transform =
    `translate3d(${dx}px,${dy}px,0) rotateX(7deg) rotateZ(-1.2deg)`;
  // 重置平移视图
  panX = 0; panY = 0; applyPan();

  buildFan(tier);
  renderBC();
}

/* ---------- 舞台平移/缩放（内容高时浏览用）---------- */
let panX=0, panY=0;
function applyPan(){
  const w=document.getElementById('world');
  const base = active
    ? `translate3d(${panX}px,${panY}px,0)`
    : '';
  if(active){
    const wd = window.innerWidth;
    const ax = anchorPx(active);
    const dx = wd*0.32 - ax;
    const dy = active._up ? -46 : 46;
    w.style.transform =
      `translate3d(${dx+panX}px,${dy+panY}px,0) rotateX(7deg) rotateZ(-1.2deg)`;
  } else {
    w.style.transform = 'translate3d(0,0,0)';
  }
}
// 拖拽平移（内容展开时）
let pd=false, plx=0, ply=0;
document.getElementById('stage').addEventListener('pointerdown', e=>{
  if(!active) return;
  if(e.target.closest('.card')||e.target.closest('.tick')) return;
  pd=true; plx=e.clientX; ply=e.clientY;
  document.getElementById('stage').style.cursor='grabbing';
});
addEventListener('pointerup', ()=>{ pd=false;
  document.getElementById('stage').style.cursor=''; });
addEventListener('pointermove', e=>{
  if(!pd) return;
  panY += e.clientY-ply; panX += e.clientX-plx;
  plx=e.clientX; ply=e.clientY;
  // 限制范围，避免拖飞
  panY = Math.min(60, Math.max(-400, panY));
  panX = Math.min(300, Math.max(-300, panX));
  applyPan();
});

function resetAll(){
  active=null; leaf=null;
  document.querySelectorAll('.tick').forEach(e=>e.classList.remove('active'));
  axis.classList.remove('focused');
  fam.innerHTML=''; fam.classList.remove('on');
  document.getElementById('world').style.transform='translate3d(0,0,0)';
  closeDrawer(true); renderBC();
}

/* ---------- 抽屉 ---------- */
function openDrawer(node){
  if(!node) return;
  // 若是朝代本身
  if(node._d===0 && node!==active){ enterTier(node); }
  document.getElementById('d-tag').textContent = TYPECN[node.type]||'条目';
  document.getElementById('d-name').textContent = node.name;
  document.getElementById('d-life').textContent =
    (node.from!=null || node.to!=null)
      ? (node.from!=null ? fmtY(node.from)+' — '+fmtY(node.to)
                         : '生年无考　卒 '+fmtY(node.to))
      : '';

  let h='';
  // 人物：字 / 号 / 入仕
  if(node.type==='person'){
    const meta=[];
    if(node.zi) meta.push(`字 ${node.zi}`);
    if(node.hao && node.hao.length) meta.push(`号 ${node.hao.join('、')}`);
    if(node.entryPath) meta.push(`${node.entryPath}${node.entryYear?(' · '+node.entryYear+'年'):''}`);
    if(node.polity) meta.push(node.polity);
    if(meta.length) h += `<div class="meta">${meta.join('　·　')}</div>`;
  }
  // 正文：有 summary 用 summary，否则用类型占位说明
  h += `<p>${node.summary || BODY[node.type] || ''}</p>`;

  // 所属家族（跨实体引用）
  const D = window.LONG_RIVER_DATA;
  const owned = (D.clans||[]).filter(c=>(c.members||[]).some(m=>m.name===node.name));
  if(owned.length){
    h += `<div class="div"></div><span class="kl">所属家族</span><div class="chips">`;
    owned.forEach(c=> h += `<span class="chip" onclick="openClan('${c.id}')">${c.name}</span>`);
    h += `</div>`;
  }
  // 年号（若此人曾为帝）
  const eras = (D.eras||[]).filter(e=>e.emperor===node.name);
  if(eras.length){
    h += `<div class="div"></div><span class="kl">年号 · ${eras.length}</span><div class="chips">`;
    eras.forEach(e=> h += `<span class="chip" onclick="openEra('${e.id}')">${e.name}<em style="font-style:normal;font-size:9px;opacity:.55;margin-left:5px">${fmtY(e.from)}</em></span>`);
    h += `</div>`;
  }

  const kids=node.children||[];
  if(kids.length){
    h+=`<div class="div"></div><span class="kl">关联 · ${kids.length}</span><div class="chips">`;
    kids.forEach(k=> h+=`<span class="chip" onclick="goto('${k.id}')">${k.name}</span>`);
    h+=`</div>`;
  }
  document.getElementById('d-body').innerHTML=h;
  document.getElementById('drawer').classList.add('on');
  document.getElementById('scrim').classList.add('on');
  leaf=node; renderBC();
}
function closeDrawer(silent){
  document.getElementById('drawer').classList.remove('on');
  document.getElementById('scrim').classList.remove('on');
  leaf=null;
  if(!silent){ renderBC(); }
}
window.closeDrawer=closeDrawer;
window.goto=id=>{
  const D = window.LONG_RIVER_DATA;
  // 附属实体（家族/地点/年号）
  if((D.clans||[]).some(c=>c.id===id)){ setMode('clan'); openClan(id); return; }
  if((D.places||[]).some(p=>p.id===id)){ setMode('place'); openPlace(id); return; }
  if((D.eras||[]).some(e=>e.id===id)){ setMode('era'); openEra(id); return; }
  const n=all.find(x=>x.id===id);
  if(!n) return;
  if(mode!=='river') setMode('river');
  if(n._d===0){ enterTier(n); closeDrawer(true); }
  else {
    // 找到它所属的顶层朝代
    let top=n;
    while(top._d>0){ top = all.find(y=>(y.children||[]).includes(top)); }
    if(top && top!==active) enterTier(top);
    openDrawer(n);
    // 高亮对应卡片
    document.querySelectorAll('.card').forEach(c=>{
      c.classList.toggle('dim', c.querySelector('.cn').textContent!==n.name);
    });
  }
};

/* ---------- 面包屑 ---------- */
function renderBC(){
  const bc=document.getElementById('bc');
  let h=`<b onclick="resetAll()">中国</b>`;
  if(active) h+=`<s>/</s><b class="on" onclick="openDrawer(active)">${active.name}</b>`;
  if(leaf && active && leaf!==active) h+=`<s>/</s><b class="on">${leaf.name}</b>`;
  bc.innerHTML=h;
}
window.resetAll=resetAll;

/* 空白处点击复位 */
document.getElementById('stage').addEventListener('click', e=>{
  if(e.target.closest('.card')||e.target.closest('.tick')) return;
  if(document.getElementById('drawer').classList.contains('on')) return;
  resetAll();
});
addEventListener('keydown', e=>{
  if(e.key!=='Escape') return;
  if(document.getElementById('drawer').classList.contains('on')) closeDrawer();
  else resetAll();
});

renderBC();

/* ============================================================
   目录模式：家族 / 地点 / 年号
   ============================================================ */
const CAT = document.getElementById('catalog');
const CATIN = document.getElementById('cat-inner');
let mode = 'river';

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function renderCatalog(m){
  const D = window.LONG_RIVER_DATA;
  let h='';
  if(m==='clan'){
    h+=`<div class="cat-sec"><h3>宋代家族<em>${D.clans.length}</em></h3>
      <div class="sub">科举时代，门阀让位于"科第世家"——同一家族累代登科、子弟并起，构成宋代政治与文化的骨架。</div>
      <div class="cat-grid">`;
    D.clans.forEach(c=>{
      h+=`<div class="ctile" onclick="openClan('${c.id}')">
        <span class="cnt">${c.members.length} 人</span>
        <div class="tn">${esc(c.name)}</div>
        <div class="tm">${esc(c.place)}　${fmtY(c.from)}–${fmtY(c.to)}</div>
        <div class="td">${esc(c.summary)}</div></div>`;
    });
    h+=`</div></div>`;
  }
  if(m==='place'){
    const order=['都城','陪都','边境','战场','贬谪地','书院'];
    order.forEach(t=>{
      const ps=D.places.filter(p=>p.type===t);
      if(!ps.length) return;
      h+=`<div class="cat-sec"><h3>${t}<em>${ps.length}</em></h3><div class="cat-grid">`;
      ps.forEach(p=>{
        h+=`<div class="ctile" onclick="openPlace('${p.id}')">
          <div class="tn">${esc(p.name)}</div>
          <div class="tm">${esc(p.polity||'')}　${fmtY(p.from)}–${fmtY(p.to)}${p.alt&&p.alt.length?'　旧称：'+esc(p.alt.join('、')):''}</div>
          <div class="td">${esc(p.summary)}</div></div>`;
      });
      h+=`</div></div>`;
    });
  }
  if(m==='era'){
    h+=`<div class="cat-sec"><h3>两宋年号<em>${D.eras.length}</em></h3>
      <div class="sub">宋代共 57 个正年号。仁宗 9 个、理宗 8 个、徽宗 6 个；高宗独用 2 个，绍兴一纪三十二年，为宋朝最久。</div>`;
    ['北宋','南宋'].forEach(p=>{
      h+=`<div class="era-group"><div class="gl">${p}　${D.eras.filter(e=>e.polity===p).length} 个</div><div class="era-wrap">`;
      D.eras.filter(e=>e.polity===p).forEach(e=>{
        h+=`<span class="era-chip" onclick="openEra('${e.id}')">${esc(e.name)}<em>${fmtY(e.from)}–${fmtY(e.to)}</em></span>`;
      });
      h+=`</div></div>`;
    });
    h+=`</div>`;
  }
  CATIN.innerHTML=h;
}

function setMode(m){
  mode=m;
  document.querySelectorAll('.modes b').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  const river = m==='river';
  CAT.classList.toggle('on',!river);
  document.getElementById('stage').style.visibility = river ? '' : 'hidden';
  document.querySelector('.legend').style.display = river ? '' : 'none';
  if(!river){ closeDrawer(true); renderCatalog(m); }
}
document.querySelectorAll('.modes b').forEach(b=>
  b.addEventListener('click',()=>setMode(b.dataset.m)));

// 打开家族
window.openClan=id=>{
  const c=window.LONG_RIVER_DATA.clans.find(x=>x.id===id);
  if(!c) return;
  document.getElementById('d-tag').textContent='家族';
  document.getElementById('d-name').textContent=c.name;
  document.getElementById('d-life').textContent=`${c.place}　${fmtY(c.from)} — ${fmtY(c.to)}`;
  let h=`<p>${c.summary}</p><div class="div"></div><span class="kl">成员</span><div class="chips">`;
  c.members.forEach(mem=>{
    const inTree = all.find(x=>x.name===mem.name);
    h += inTree
      ? `<span class="chip" onclick="goto('${inTree.id}')">${mem.name}<em style="font-style:normal;font-size:9px;opacity:.6;margin-left:6px">${fmtY(mem.from)}</em></span>`
      : `<span class="chip" style="cursor:default;opacity:.7">${mem.name}<em style="font-style:normal;font-size:9px;opacity:.6;margin-left:6px">${fmtY(mem.from)}</em></span>`;
  });
  h+=`</div>`;
  document.getElementById('d-body').innerHTML=h;
  document.getElementById('drawer').classList.add('on');
  document.getElementById('scrim').classList.add('on');
};
window.openPlace=id=>{
  const D=window.LONG_RIVER_DATA;
  const p=D.places.find(x=>x.id===id);
  if(!p) return;
  document.getElementById('d-tag').textContent=p.type;
  document.getElementById('d-name').textContent=p.name;
  document.getElementById('d-life').textContent=
    `${p.polity||''}　${fmtY(p.from)} — ${fmtY(p.to)}`;
  let h='';
  if(p.alt&&p.alt.length) h+=`<div class="meta">旧称　${esc(p.alt.join('、'))}</div>`;
  h+=`<p>${p.summary}</p>`;
  // 关联事件
  if(p.events&&p.events.length){
    h+=`<div class="div"></div><span class="kl">关联事件 · ${p.events.length}</span><div class="chips">`;
    p.events.forEach(eid=>{
      const n=all.find(x=>x.id===eid);
      if(n) h+=`<span class="chip" onclick="goto('${eid}')">${n.name}</span>`;
    });
    h+=`</div>`;
  }
  document.getElementById('d-body').innerHTML=h;
  document.getElementById('drawer').classList.add('on');
  document.getElementById('scrim').classList.add('on');
};
window.openEra=id=>{
  const e=window.LONG_RIVER_DATA.eras.find(x=>x.id===id);
  if(!e) return;
  document.getElementById('d-tag').textContent='年号';
  document.getElementById('d-name').textContent=e.name;
  document.getElementById('d-life').textContent=`${e.emperor}　${fmtY(e.from)} — ${fmtY(e.to)}　凡 ${e.to-e.from+1} 年`;
  let h=`<p>${e.note || (e.polity+'年号，'+e.emperor+'在位期间使用，起'+fmtY(e.from)+'，讫'+fmtY(e.to)+'。')}</p>`;
  document.getElementById('d-body').innerHTML=h;
  document.getElementById('drawer').classList.add('on');
  document.getElementById('scrim').classList.add('on');
};

window.__diag=()=>({
  ticks:document.querySelectorAll('.tick').length,
  cards:document.querySelectorAll('.card').length,
  active:active?active.id:null,
  drawer:document.getElementById('drawer').classList.contains('on'),
  worldT:document.getElementById('world').style.transform,
  mode:mode,
  catTiles:document.querySelectorAll('.ctile').length,
  eraChips:document.querySelectorAll('.era-chip').length,
  catOn:CAT.classList.contains('on')
});
window.addEventListener('error',e=>{ window.__err=e.message; });
</script>
